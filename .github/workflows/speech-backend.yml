name: Speech Backend

on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t speech-backend ./backend

      - name: Start backend
        run: |
          docker run -d \
            --name speech-backend \
            -p 8000:8000 \
            -e ALLOWED_ORIGINS="https://speech-a.netlify.app,http://localhost:5173,http://127.0.0.1:5173" \
            speech-backend

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 5
          done

          echo "Backend failed to start."
          docker logs speech-backend
          exit 1

      - name: Install Cloudflare Tunnel
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

      - name: Start public tunnel
        run: |
          nohup cloudflared tunnel \
            --url http://localhost:8000 \
            > cloudflared.log 2>&1 &

          for i in {1..30}; do
            URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "=========================================="
              echo "PUBLIC BACKEND URL:"
              echo "$URL"
              echo "=========================================="
              break
            fi

            sleep 2
          done

          cat cloudflared.log

      - name: Keep runner alive
        run: |
          echo "Speech Analyzer backend is running."
          echo "Runner will remain alive for the workflow duration."

          while true; do
            sleep 300
            echo "Backend still running..."
            curl -fsS http://localhost:8000/health || exit 1
            done
